# Supabase CLI configuration — only the settings this feature needs.
# project_id here is a local label for the CLI, not the remote project ref.
project_id = "deus-booking"

[functions.resend-email]
# Keep the platform JWT check ON. It is not enough on its own (the public anon key is a
# valid JWT), so the function also confirms the caller is a signed-in Admin.
# Deploy the output of scripts/build-email-functions.sh (test or live), not this folder directly.
verify_jwt = true
