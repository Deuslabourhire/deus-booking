<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>TEST — Subcontractors Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;color:#111}
.bar{background:#b91c1c;color:#fff;padding:8px 14px;font-size:13px;font-weight:bold}
.wrap{max-width:900px;margin:0 auto;padding:14px}
.login{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;max-width:340px}
.login input{display:block;width:100%;box-sizing:border-box;margin:6px 0;padding:9px;border:1px solid #ccc;border-radius:6px}
.login button{padding:9px 14px;border:none;border-radius:6px;background:#1a8a1a;color:#fff;cursor:pointer}
#err{color:#b91c1c;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<div class="bar">TEST ENVIRONMENT — deus-authtest (aaafpfkwpdpfamfuimki). Not production.</div>
<div class="wrap">
  <div class="login" id="login">
    <b>Admin login (test project)</b>
    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <input type="password" id="pass" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Login</button>
    <div id="err"></div>
  </div>
  <div id="app" style="display:none">
    <button id="logoutBtn" style="float:right">Logout</button>
    <div id="subs"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="./subcontractor-admin.js"></script>
<script>
(function () {
  var SUPABASE_URL = 'https://aaafpfkwpdpfamfuimki.supabase.co';
  var PUBLIC_KEY = '__SUPABASE_PUBLISHABLE_KEY__';
  var db = window.supabase.createClient(SUPABASE_URL, PUBLIC_KEY);
  function $(id) { return document.getElementById(id); }

  async function isAdmin(userId) {
    var r = await db.from('user_roles').select('role').eq('user_id', userId).maybeSingle();
    return !r.error && r.data && r.data.role === 'admin';
  }
  async function enter() {
    $('login').style.display = 'none'; $('app').style.display = 'block';
    await SubAdmin.init(db, $('subs'));
  }
  $('loginBtn').onclick = async function () {
    $('err').textContent = '';
    var r = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
    $('pass').value = '';
    if (r.error || !r.data.user) { $('err').textContent = 'Invalid email or password.'; return; }
    if (!(await isAdmin(r.data.user.id))) { await db.auth.signOut(); $('err').textContent = 'Access denied: not an admin.'; return; }
    enter();
  };
  $('logoutBtn').onclick = async function () { await db.auth.signOut(); location.reload(); };
  db.auth.getSession().then(async function (s) {
    var u = s.data.session && s.data.session.user;
    if (u && await isAdmin(u.id)) enter();
  });
})();
</script>
</body>
</html>
